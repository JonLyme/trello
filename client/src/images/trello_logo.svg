<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Trello logo</title>
  <desc id="desc">Trello blue icon with two white panels and dark navy Trello wordmark.</desc>

  <defs>
    <linearGradient id="trelloBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C66E4"/>
      <stop offset="100%" stop-color="#0055CC"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="40" y="40" width="280" height="280" rx="38" fill="url(#trelloBlue)"/>
  <rect x="90" y="90" width="78" height="180" rx="16" fill="#FFFFFF"/>
  <rect x="192" y="90" width="78" height="128" rx="16" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="370" y="246"
        font-family="Arial, Helvetica, sans-serif"
        font-size="210"
        font-weight="700"
        letter-spacing="-8"
        fill="#172B4D">Trello</text>
</svg>
